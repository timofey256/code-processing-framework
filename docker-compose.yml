services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypass
      RABBITMQ_DEFAULT_VHOST: myvhost
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["server"]
    depends_on:
      - rabbitmq
    ports:
      - "8081:8081"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672

  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    command: ["processor"]
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
